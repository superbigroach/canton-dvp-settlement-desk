[toolchain]
anchor_version = "0.31.1"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
etp_basket_vault = "ERs1iunZ9RWCRCWTaND3B1YNBNcs1bAPZWfCU9YByc5m"

[programs.devnet]
etp_basket_vault = "ERs1iunZ9RWCRCWTaND3B1YNBNcs1bAPZWfCU9YByc5m"

