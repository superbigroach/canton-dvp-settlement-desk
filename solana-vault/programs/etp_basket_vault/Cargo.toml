[package]
name = "etp_basket_vault"
version = "0.1.0"
description = "ETP Foundry basket vault: fixed-basket share token with AP create/redeem, K-of-N attested NAV, timelocked rebalance"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "etp_basket_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1" }
anchor-spl = { version = "0.31.1" }
