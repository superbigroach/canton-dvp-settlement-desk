# application.yml — Canton DvP Settlement Desk backend.
# ---------------------------------------------------------------------------
# Every value is overridable by an environment variable (Spring relaxed binding),
# so the SAME jar / container image runs against a local sandbox and a real
# Canton participant with no rebuild:
#
#   LOCAL SANDBOX (default):   plaintext, no auth
#     LEDGER_HOST=localhost LEDGER_PORT=6865 LEDGER_TLS=false      (no LEDGER_JWT)
#
#   REAL CANTON PARTICIPANT:   TLS + JWT bearer
#     LEDGER_HOST=participant.example  LEDGER_PORT=6865
#     LEDGER_TLS=true  LEDGER_JWT=<bearer-token-scoping-actAs/readAs>
# ---------------------------------------------------------------------------
server:
  port: ${SERVER_PORT:8080}

ledger:
  host: ${LEDGER_HOST:localhost}
  port: ${LEDGER_PORT:6865}
  tls: ${LEDGER_TLS:false}
  # Leave empty for the local sandbox (no auth). Set to a bearer token for a real
  # participant. NEVER commit a real token — inject it via env / a k8s Secret.
  jwt: ${LEDGER_JWT:}
  application-id: ${LEDGER_APPLICATION_ID:canton-dvp-desk}
  connect-timeout-seconds: ${LEDGER_CONNECT_TIMEOUT_SECONDS:10}

# ---------------------------------------------------------------------------
# CIP-56 token standard — the off-ledger Registry API (/registry/...) and the
# wallet side that claims assets from OTHER registries (/api/token-standard/...).
# Every value here is optional; with none set the registry API discovers its own
# admin from the ledger and foreign accepts are attempted with an empty context.
# ---------------------------------------------------------------------------
registry:
  # Pin the instrument-admin party this desk's registry serves. Leave blank to
  # DISCOVER it from the live TokenStandardRegistry contract — the right default,
  # because a local sandbox re-mints its party namespace on every run.
  admin: ${REGISTRY_ADMIN:}
  # A FOREIGN registry's API root, used for any instrument admin without an
  # explicit override below. Accepting a transfer from another registry may
  # require a choice context that only that registry can produce.
  #   e.g. REGISTRY_REMOTE_URL=https://cbtc-faucet.bitsafe.finance
  remote-url: ${REGISTRY_REMOTE_URL:}
  # Per-admin overrides: comma-separated  admin=url  pairs, where `admin` is a
  # full party id or its label.
  #   e.g. REGISTRY_REMOTE_URLS="bitsafe=https://registry.bitsafe.example"
  remote-urls: ${REGISTRY_REMOTE_URLS:}
  # Prefer the token-standard interface package this backend was compiled against
  # when resolving an interface exercise. Turn OFF only if a participant cannot
  # resolve that exact package (REGISTRY_PIN_INTERFACE_PACKAGE=false).
  pin-interface-package: ${REGISTRY_PIN_INTERFACE_PACKAGE:true}

# ---------------------------------------------------------------------------
# The demo fund. `Test:initialize` seeds instruments and holdings but no basket, so
# at start-up the desk defines LX1 (0.10 cETH + 0.01 CBTC, administered by Bank, APs
# Alice and Bob) through the same path as POST /api/basket — and lists it as a `Fund`
# instrument so it trades. Idempotent; never fails the boot. Turn it OFF on a real
# participant: DEMO_SEED_FUND=false.
# ---------------------------------------------------------------------------
demo:
  seed-fund: ${DEMO_SEED_FUND:true}
  # Also seed a K-of-N committee (Issuer, Bank, Venue; K=2) at start-up, so the signer
  # portal has something to sign against on a fresh sandbox. Off on a participant.
  seed-committee: ${DEMO_SEED_COMMITTEE:true}

# ---------------------------------------------------------------------------
# Identity — docs/PRODUCT-PLAN.md §3. Every /api/** route except the public set is
# behind a Firebase ID token verified by firebase-admin.
#
#   AUTH_MODE=firebase   (default in the image) verify `Authorization: Bearer <id token>`
#                        against Firebase project `auth.firebase-project-id`, using
#                        Application Default Credentials (the Cloud Run service account).
#                        The pre-existing operator-desk routes then require role `admin`.
#   AUTH_MODE=sandbox    accept `X-Sandbox-User: <email>` instead of a token, and let the
#                        pre-existing operator-desk routes through with NO headers at all
#                        (that is what the live desk on the hosted sandbox does today).
#
# An API key (`Authorization: Bearer ck_…`, minted at POST /api/signer/apikey) is
# accepted in BOTH modes as the user it was issued to.
# ---------------------------------------------------------------------------
auth:
  mode: ${AUTH_MODE:firebase}
  firebase-project-id: ${FIREBASE_PROJECT_ID:crossdesk-devnet-app}
  # The user → role/party mapping seed. Defaults to the classpath users.yml; point
  # USERS_FILE at a file on disk to override the whole roster without a rebuild.
  users-file: ${USERS_FILE:classpath:users.yml}
  # Where the desk keeps its own state: users edited through the API, signer
  # settings, the append-only fixing_events log, the strike schedule. In-memory
  # plus a file so a restart does not lose the audit trail. On the in-memory
  # sandbox image this directory is as ephemeral as the ledger, which is honest.
  data-dir: ${DATA_DIR:./data}
  # The party the desk PROPOSES as when the scheduler strikes (must be a committee
  # member). "Issuer" in the sandbox; on a participant, the administrator's own party.
  operator-party: ${OPERATOR_PARTY:Issuer}

# The strike runner (docs/PRODUCT-PLAN.md §4/§5 "Scheduler"). Safe on the sandbox:
# everything it does is a ledger command any operator could send by hand, plus an
# event. Off with SCHEDULER_ENABLED=false.
scheduler:
  enabled: ${SCHEDULER_ENABLED:true}
  # How often the runner looks at the clock, in milliseconds.
  tick-ms: ${SCHEDULER_TICK_MS:60000}

spring:
  application:
    name: canton-dvp-desk

# Surface a JSON error body (message + status) instead of the default HTML page.
server.error:
  include-message: always
