# NYSE full-day market closures — the `nyse` strike calendar.
# ---------------------------------------------------------------------------
# Source: https://www.nyse.com/trade/hours-calendars ("All NYSE markets observe
# U.S. holidays as listed below for 2026, 2027, and 2028"), read 2 Sep 2026.
# Only FULL closures are listed. Early-close days (the day after Thanksgiving,
# 24 Dec 2026) are trading days and are deliberately not here: a 13:00 close
# still prints a close.
#
# Override without a rebuild: CALENDARS_DIR=/path/to/dir containing nyse.yml.
# Weekends are never strike days on this calendar (weekends: false).
calendar: nyse
name: New York Stock Exchange
source: https://www.nyse.com/trade/hours-calendars
weekends: false
holidays:
  2026-01-01: New Year's Day
  2026-01-19: Martin Luther King, Jr. Day
  2026-02-16: Washington's Birthday
  2026-04-03: Good Friday
  2026-05-25: Memorial Day
  2026-06-19: Juneteenth National Independence Day
  2026-07-03: Independence Day (observed; 4 July is a Saturday)
  2026-09-07: Labor Day
  2026-11-26: Thanksgiving Day
  2026-12-25: Christmas Day
  2027-01-01: New Year's Day
  2027-01-18: Martin Luther King, Jr. Day
  2027-02-15: Washington's Birthday
  2027-03-26: Good Friday
  2027-05-31: Memorial Day
  2027-06-18: Juneteenth National Independence Day (observed; 19 June is a Saturday)
  2027-07-05: Independence Day (observed; 4 July is a Sunday)
  2027-09-06: Labor Day
  2027-11-25: Thanksgiving Day
  2027-12-24: Christmas Day (observed; 25 December is a Saturday)
