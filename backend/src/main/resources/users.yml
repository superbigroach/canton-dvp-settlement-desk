# users.yml — the user → role + party mapping seed (docs/PRODUCT-PLAN.md §3).
# ---------------------------------------------------------------------------
# Loaded at boot; edits made through /api/admin/users and the signer portal are kept in
# <DATA_DIR>/users.json and re-applied on top of this file. Point USERS_FILE at a copy
# of this file to replace the roster without a rebuild.
#
# In production the party is on the institution's own participant; the mapping is the
# same shape. In the sandbox the parties are the ones Test:initialize allocates, and
# the e-mails are the ones the desk app (frontend/src/desk) signs in with.
#
# Roles: admin | signer (seat: issuer|lender|venue|custodian|transfer-agent, instruments) |
#        ap | fund_admin | auditor | viewer
#
# X-Sandbox-User (AUTH_MODE=sandbox) accepts the e-mail, its local part, or the party
# label: "issuer@sandbox.crossdesk", "issuer" and "Issuer" all resolve to the same row.
# ---------------------------------------------------------------------------
users:
  - uid: admin-sborjas
    email: s.borjas@lucilla.ca
    role: admin
    party: Issuer           # ledger actions the admin console takes are submitted as Issuer
    org: CrossDesk
    displayName: Sebastian Borjas

  - uid: sandbox-issuer
    email: issuer@sandbox.crossdesk
    role: signer
    seat: issuer
    party: Issuer
    instruments: [CBTC, cETH]
    org: Issuer (sandbox stand-in for the wrapper issuer)
    displayName: Issuer seat

  - uid: sandbox-lender
    email: lender@sandbox.crossdesk
    role: signer
    seat: lender
    party: Bank
    instruments: [CBTC, cETH]
    org: Bank (sandbox stand-in for a lending platform)
    displayName: Lender seat

  - uid: sandbox-venue
    email: venue@sandbox.crossdesk
    role: signer
    seat: venue
    party: Venue
    instruments: [CBTC, cETH]
    org: Venue (sandbox stand-in for a trading venue)
    displayName: Venue seat

  # The §2e / §2f seats of SIGNER_PROTOCOL v2. Test:initialize allocates no party for
  # either, so DemoSeed allocates Custodian and TransferAgent on the local sandbox and
  # seats them on the demo committee; on a participant the party is the institution's own.
  - uid: sandbox-custodian
    email: custodian@sandbox.crossdesk
    role: signer
    seat: custodian
    party: Custodian
    instruments: [CBTC, cETH]
    org: Custodian (sandbox stand-in for the reserve holder)
    displayName: Custodian seat

  - uid: sandbox-transferagent
    email: transferagent@sandbox.crossdesk
    role: signer
    seat: transfer-agent
    party: TransferAgent
    instruments: [CBTC, cETH]
    org: Transfer agent (sandbox stand-in for the fund administrator)
    displayName: Transfer-agent seat

  - uid: sandbox-alice
    email: alice@sandbox.crossdesk
    role: ap
    party: Alice
    org: Alice Capital (sandbox AP)
    displayName: Alice

  - uid: sandbox-bob
    email: bob@sandbox.crossdesk
    role: ap
    party: Bob
    org: Bob Markets (sandbox AP)
    displayName: Bob

  - uid: sandbox-fund
    email: fund@sandbox.crossdesk
    role: fund_admin
    party: Bank             # Bank administers the demo basket (see DemoSeed)
    # NO HARDCODED FUND. This said `instruments: [LX1]`, and LX1 is the LOCAL demo
    # basket DEMO_SEED_FUND creates — false on the DevNet participant, so the fund
    # administrator's dashboard was the string "no fund 'LX1'". The portal now asks
    # GET /api/fund/funds which funds this party administers, which is a fact about
    # the ledger rather than a field somebody typed here.
    instruments: []
    org: Fund administrator (sandbox)
    displayName: Fund administrator

  - uid: sandbox-auditor
    email: auditor@sandbox.crossdesk
    role: auditor
    party: Auditor
    org: Auditor (sandbox)
    displayName: Auditor
