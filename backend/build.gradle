// build.gradle — Spring Boot 3.x backend for the Canton DvP Settlement Desk.
// ---------------------------------------------------------------------------
// A REST desk that drives the Daml/Canton Ledger API over gRPC using the Daml
// Java Bindings (2.9.4). The SAME jar runs against a local plaintext sandbox
// (no auth) and a real Canton participant (TLS + JWT) — see application.yml.
//
// Java 17 (matches the WSL toolchain + the Daml 2.9.4 codegen output). The
// container image (Dockerfile) builds and runs on Temurin 21; the bytecode is
// targeted at 17 so both work.
// ---------------------------------------------------------------------------
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.lucilla.settlement'
version = '1.0.0'

// Target Java 17 bytecode using whatever JDK runs the build — Java 17 in the WSL
// toolchain, Java 21 in the Docker build image. (A strict `toolchain{}` block
// would force Gradle to hunt for a 17 JDK and fail inside the 21 container.)
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

// The Daml Java codegen (`daml codegen java`, configured in ../daml.yaml) writes
// strongly-typed template classes here. They are committed, so this build — and
// the Docker build, which has no Daml SDK — compiles without regenerating.
sourceSets {
    main {
        java {
            srcDir 'src/main/generated-java'
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Daml Java Bindings (3.4) — the Ledger API v2 client + codegen runtime.
    // bindings-rxjava transitively brings grpc-netty, protobuf, rxjava2, so the gRPC
    // transport (plaintext or TLS) is fully wired with just these two.
    //
    // WHY 3.x AND NOT 2.9.4 ANY MORE. The Daml model is built by SDK 3.4.11 to
    // Daml-LF 2.2 (it data-depends on the CIP-56 splice-api-token DARs, which only
    // exist on the 3.x line), and `daml codegen java` for that DAR emits 3.x-only
    // bindings — they implement `Exercises.Archivable` and carry a
    // `ContractTypeCompanion.Package`, neither of which exists in 2.9.4. A 2.9.4
    // client also speaks Ledger API v1, which a Daml 3.4 participant no longer
    // serves, so it could not have talked to this project's own sandbox regardless.
    // Kept in lockstep with backend-devnet so ONE codegen output compiles in both.
    implementation 'com.daml:bindings-java:3.4.0-snapshot.20250714.14008.0.vfe77a32d'
    implementation 'com.daml:bindings-rxjava:3.4.0-snapshot.20250714.14008.0.vfe77a32d'

    // Firebase Authentication — verifies the ID token the app sends on every
    // /api/** call (docs/PRODUCT-PLAN.md §3). Only token verification is used, so
    // the Firestore and Storage clients (and the newer gRPC line they drag in, which
    // would collide with the Daml bindings' grpc-netty) are excluded.
    implementation('com.google.firebase:firebase-admin:9.4.3') {
        exclude group: 'com.google.cloud', module: 'google-cloud-firestore'
        exclude group: 'com.google.cloud', module: 'google-cloud-storage'
    }
    // firebase-admin builds its FirebaseOptions with JacksonFactory from the google-http-client
    // jackson2 module, which the exclusions above stop arriving transitively. Without it every
    // request carrying a Firebase token dies with ClassNotFoundException (seen live 2 Sep 2026).
    implementation 'com.google.http-client:google-http-client-jackson2:1.45.0'
    implementation 'com.google.api-client:google-api-client:2.7.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Spring Boot 3.3 manages a newer Netty than grpc-netty 1.60 was built against.
// Pin protobuf to the version the Daml bindings were compiled with to avoid a
// generated-vs-runtime protobuf mismatch.
dependencyManagement {
    dependencies {
        dependency 'com.google.protobuf:protobuf-java:3.24.0'
    }
}

test {
    useJUnitPlatform {
        // Integration tests need a running ledger; excluded from the default
        // build so `./gradlew build` NEVER depends on a live Canton/sandbox.
        // Run them explicitly with:  ./gradlew integrationTest
        excludeTags 'integration'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Opt-in task that DOES run the @Tag("integration") tests (against a ledger the
// operator has already started — see run-local.md). Not wired into `build`.
tasks.register('integrationTest', Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}
