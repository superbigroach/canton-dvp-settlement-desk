# ETP Foundry signer - VENUE seat (docs/SIGNER_PROTOCOL.md §2c and §2c-bis, v2).
# Asserts: the mark sits where the asset traded - OR that nothing traded, and where the
# book stood. The tape decides which claim the service makes on each proposal:
#
#   prints in the window   -> checks: traded-range + spread-within-tolerance + sufficient-volume
#                             evidence: { low, high } (enforced on-ledger), spread, volume
#   an EMPTY tape ([])     -> checks: no-prints-attested only
#                             evidence: { bestBid, bestAsk }; no range is sent
#
# Never both. A null / missing tape is a source problem and HALTS (an absence of trades
# and an absence of data are different facts).
#
# Try it now against the hosted sandbox, no account needed:
#   CROSSDESK_SANDBOX_USER=venue@sandbox.crossdesk node dist/index.js --config examples/venue.yml
# In production replace sandboxUser with apiKey (CROSSDESK_API_KEY from the signer portal)
# and point each source at your own book.

crossdesk:
  baseUrl: https://crossdesk-devnet-app.web.app
  apiKey: ${CROSSDESK_API_KEY}                 # production: Authorization: Bearer ck_...
  sandboxUser: ${CROSSDESK_SANDBOX_USER}       # sandbox only: X-Sandbox-User (venue@sandbox.crossdesk)
  webhookSecret: ${CROSSDESK_WEBHOOK_SECRET}   # the secret you saved in the signer portal
  poll:
    enabled: true            # the fallback when CrossDesk cannot reach a public URL of yours
    intervalSeconds: 20

server:
  port: ${PORT:-8787}
  webhookPath: /webhook

state:
  file: ${SIGNER_STATE:-./signer-state.venue.json}

seat: venue
instruments: [CBTC, cETH]

venue:
  attestNoPrints: true       # false = v1 behaviour: an empty window halts the seat instead

tolerances:
  maxSpreadBps: 50       # spread-within-tolerance: best bid/ask at the strike, in bp of mid
  minVolume: 1           # sufficient-volume: units traded in the window

# Evidence mapping (backend field names, sent as-is):
#   traded-range             { prints } or { low, high }   low <= price <= high; the ledger refuses otherwise
#   spread-within-tolerance  { spreadBps } or { bid, ask } spread (bp of mid) <= maxSpreadBps
#   sufficient-volume        { volume }                    volume >= minVolume and > 0
#   no-prints-attested       { bestBid, bestAsk }          0 = no quote on that side; when both are quoted,
#                                                          bestBid <= price <= bestAsk, else refuse
conditions:
  # The service computes low/high from the prints (numbers, or objects with price/px/p),
  # or you may return {low, high} directly. An empty list means "nothing traded".
  traded-range:
    prints:
      # Sandbox stand-in: CBTC is seeded at 65000 and cETH at 2400. A real venue points
      # this at its trade tape for the strike window, e.g.:
      #   kind: http
      #   url: https://book.example.com/v1/trades?symbol={instrument}&window=strike
      #   bearer: ${BOOK_TOKEN}
      #   pointer: /trades          # -> [{ price, size, ts }, ...]  ([] when nothing traded)
      kind: command
      command: node -e "const p=Number('{price}');console.log(JSON.stringify([p*0.999,p*1.0004,p*1.0012,p*0.9996]))"
      # ^ the sandbox has no venue book, so this synthesises four prints around the proposal.
      #   Replace it. A checker that reads the proposal to build its own evidence is a rubber stamp.
  spread-within-tolerance:
    # Either spreadBps directly, or bid+ask (the service computes bp of mid).
    bid:
      kind: command
      command: node -e "const p=Number('{price}');console.log(JSON.stringify({bid:p*0.9995,ask:p*1.0005}))"
      pointer: /bid
    ask:
      kind: command
      command: node -e "const p=Number('{price}');console.log(JSON.stringify({bid:p*0.9995,ask:p*1.0005}))"
      pointer: /ask
  sufficient-volume:
    volume:
      kind: static
      value: 12.5
  no-prints-attested:
    # Used only when the tape is empty. Same book snapshot as the spread; a side with no
    # resting order reports 0.
    #   bestBid: { kind: http, url: https://book.example.com/v1/book?symbol={instrument}, bearer: ${BOOK_TOKEN}, pointer: /bids/0/price }
    #   bestAsk: { kind: http, url: https://book.example.com/v1/book?symbol={instrument}, bearer: ${BOOK_TOKEN}, pointer: /asks/0/price }
    bestBid:
      kind: command
      command: node -e "const p=Number('{price}');console.log(JSON.stringify({bid:p*0.9995,ask:p*1.0005}))"
      pointer: /bid
    bestAsk:
      kind: command
      command: node -e "const p=Number('{price}');console.log(JSON.stringify({bid:p*0.9995,ask:p*1.0005}))"
      pointer: /ask
