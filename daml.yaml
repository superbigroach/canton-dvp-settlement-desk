# daml.yaml — DAML project manifest for the Canton DvP Settlement Desk.
# ---------------------------------------------------------------------------
# This is what the `daml` assistant reads to build, test, and run the project
# (the DAML equivalent of package.json / Cargo.toml).
#
# sdk-version — set to your installed SDK. After installing the DAML SDK, run:
#       daml version
#   and confirm `sdk-version` below matches it (this project is built on 2.9.4).
#   The build refuses to run if the pinned SDK is not installed.
#
#   For CANTON NETWORK DEVNET deployment the ledger runs a specific Splice / Daml
#   release — see DEPLOY.md. Build the DAR with the SDK line the Devnet onboarding
#   specifies; the DAML source here is written in the portable subset that compiles
#   on both the current 2.x LTS and the 3.x line.
# ---------------------------------------------------------------------------

sdk-version: 3.4.11

name: crossdesk                          # package name (appears in the DAR)
version: 2.0.0                           # package version (semver)
source: daml                             # directory holding the .daml sources

# All modules under `source: daml` are auto-discovered — no per-file listing:
#   Instrument.daml     — the tokenised-asset definition layer (InstrumentKey + Instrument).
#   Holding.daml        — the balance layer (issuer-signed, owner-observer; Transfer/Split/Merge).
#   Settlement.daml     — atomic DvP (propose -> accept -> Settle) + SettlementBatch + receipts.
#   MarketOnClose.daml  — the sealed-order Market-on-Close auction (programmable dark pool).
#   Agent.daml          — delegated / agent-initiated settlement under a mandate limit.
#   Governance.daml     — the decentralised operator: a K-of-N committee (OperatorCommittee)
#                         that strikes a threshold-attested NavFixing (the official price no
#                         single party can print). MarketOnClose can bind a close to it.
#   Basket.daml         — the ETF / tokenised-fund builder: in-kind CREATION & REDEMPTION
#                         (deliver underlyings ↔ mint/burn shares, atomically) + NAV per share.
#   Test.daml           — Daml Script scenarios + the `initialize` init-script below.

# `daml start` auto-runs this script after spinning up the local sandbox: it
# allocates the parties, publishes the instruments, and seeds a live DvP proposal
# for the Navigator UI.
init-script: Test:initialize

# Standard-library + scripting deps. All three ship with the SDK — NO external
# daml-finance .dar dependency in the buildable code (that avoids version-pinning
# breakage; see docs/DAML_FINANCE_INTEGRATION.md for the documented library swap).
#   daml-prim / daml-stdlib — the DAML standard library.
#   daml-script             — the Daml.Script module used by Test.daml.
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script

# ---------------------------------------------------------------------------
# CIP-56 / Canton Network Token Standard (Splice) — vendored DARs.
#
# These are the OFFICIAL, unmodified `splice-api-token-*` interface packages,
# copied byte-for-byte from the Splice release into `deps/` so this project is
# self-contained and reproducible (no Desktop / absolute paths, no network
# fetch at build time).
#
# They are `data-dependencies` (not `dependencies`) because they are compiled
# DARs from a DIFFERENT SDK line: the Token Standard packages were built with
# SDK 3.5.2 targeting Daml-LF 2.1, and this project builds with SDK 3.4.11
# targeting LF 2.2. A higher-LF package may consume a lower-LF data-dependency,
# which is exactly why this works without installing 3.5.2.
#
# Only the v1 interface set is wired in — that is the version currently live on
# Canton Network DevNet/MainNet (splice-api-token-*-v1-1.0.0).
# ---------------------------------------------------------------------------
data-dependencies:
  - deps/splice-api-token-metadata-v1-1.0.0.dar
  - deps/splice-api-token-holding-v1-1.0.0.dar
  - deps/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - deps/splice-api-token-allocation-v1-1.0.0.dar
  - deps/splice-api-token-allocation-instruction-v1-1.0.0.dar
  - deps/splice-api-token-allocation-request-v1-1.0.0.dar

# Compiled DAR output location.
build-options:
  - --output=.daml/dist/crossdesk-2.0.0.dar

# ---------------------------------------------------------------------------
# Java codegen — generates the strongly-typed Java bindings for every template
# (Instrument, Holding, DvPProposal/DvPAgreement, ClosingAuction/SealedOrder,
# SettlementReceipt/SettlementBatch, TradingMandate, …) that the Spring Boot
# backend (backend/) uses to build Ledger API Create/Exercise commands.
#
# Run it (after `daml build`) with:
#     daml codegen java
#
# Output lands in `backend/src/main/generated-java` under the package
# `com.lucilla.settlement.model`, and the Gradle build adds that directory as a
# source root (see backend/build.gradle → sourceSets.main.java). The generated
# sources ARE committed so `./gradlew build` (and the Docker build, which has no
# Daml SDK) compiles without needing to regenerate.
# ---------------------------------------------------------------------------
codegen:
  java:
    package-prefix: com.lucilla.settlement.model
    output-directory: backend/src/main/generated-java
    verbosity: 1
